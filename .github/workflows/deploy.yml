name: Deploy

on:
  push:
    branches: [main]
  # Manual redeploy of an arbitrary ref. Required for the documented rollback path
  # ("re-run deploy.yml on the previous good commit"), which was impossible without a
  # push, and for recovering when a run dies for infrastructure reasons rather than a
  # bad commit. A dispatch deliberately bypasses the path filters (see the backend job).
  workflow_dispatch:

concurrency:
  # Serialize deploys; never sever one mid-`sam deploy`/`wrangler`. NOTE: this only stays
  # safe because the `production` environment has NO required reviewer. If you ever add one,
  # an unapproved run holds this lock indefinitely and every later push starves behind it
  # (happened: main sat 3 commits undeployed for a day). Gate deploys some other way, or
  # switch to cancel-in-progress: true at the same time.
  group: deploy-main
  cancel-in-progress: false

permissions:
  id-token: write # assume the AWS deploy role via OIDC — no stored AWS keys
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      infra: ${{ steps.f.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            backend: ['backend/**']
            frontend: ['frontend/**']
            infra: ['infra/**']

  backend:
    needs: changes
    # A manual dispatch always deploys everything. Path filters diff against the previous
    # commit, which makes them wrong for recovery: if a push touches only unrelated files
    # (say .github/**), every job skips even though earlier app commits are still
    # undeployed — and since only one run may sit *pending* per concurrency group, a newer
    # queued run cancels the older pending one, so the run that would have deployed those
    # commits disappears. Net effect: commits can silently never reach production. A
    # dispatch must therefore never be path-filtered.
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true' }}
    # MUST be an arm64 runner: template.yaml sets `Architectures: [arm64]`, so on an x86_64
    # runner `sam build --use-container` pulls the arm64 build image and compiles
    # pillow-heif's native libs under QEMU emulation. SAM even warns ("Cross-architecture
    # build detected … may cause build failures"). In practice it doesn't just get slow — it
    # produced zero output for 21 minutes straight and never finished. Building arm64 natively
    # keeps the Lambda-matching container CLAUDE.md requires. Free for public repos.
    runs-on: ubuntu-24.04-arm
    # A hung build would otherwise hold the deploy-main lock for GitHub's default 6h job
    # limit, starving every later push — the exact shape of the outage this replaced.
    timeout-minutes: 25
    environment: production # scopes the deploy secrets/vars; intentionally NOT reviewer-gated
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ca-central-1
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - run: sam build --use-container
      - run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset

  frontend:
    needs: [changes, backend]
    # Run even if backend was skipped (frontend-only change), but ONLY if backend didn't
    # fail *or get cancelled*. The old `!contains(result,'failure')` let a cancelled backend
    # through — observed for real: `sam build` was cancelled and the frontend deployed
    # anyway, i.e. a new UI shipped against a backend that never updated.
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true') && (needs.backend.result == 'success' || needs.backend.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0 # explicit: action runs at repo root (no root package.json to read)
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # pnpm 11.9 needs Node >=22.13 (uses node:sqlite); matches local
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build (VITE_* injected from GitHub vars/secrets)
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: pnpm build
      - name: Guard — the bundle must contain the API URL (never ship a blank app)
        run: grep -rq "${{ vars.VITE_API_BASE_URL }}" dist/assets/*.js
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Path is repo-root-relative on purpose. `defaults.run.working-directory` applies
          # only to `run:` steps, never to `uses:` steps, so this action always executes at
          # the repo root — hence `frontend/dist`, not `dist` (which failed with
          # "ENOENT: scandir '<repo>/dist'").
          #
          # Do NOT "fix" that with `workingDirectory: frontend`. Tried, failed: the action
          # picks its package manager from the directory it runs in, so inside frontend/ it
          # finds pnpm-lock.yaml and runs `pnpm add wrangler` — installing wrangler into the
          # app's own dependency tree, which exits 1. At the repo root there is no lockfile,
          # so it installs wrangler in isolation via npm, which works.
          #
          # --commit-dirty: dist/ is gitignored, so the tree is always "dirty" by design.
          command: pages deploy frontend/dist --project-name=spending-tracker --branch=main --commit-dirty=true

  smoke:
    needs: [backend, frontend]
    if: ${{ always() && (needs.backend.result == 'success' || needs.frontend.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Post-deploy smoke (health, auth gate, single CORS header)
        env:
          API: ${{ vars.VITE_API_BASE_URL }}
          ORIGIN: https://spending-tracker-1o6.pages.dev
        run: |
          set -e
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API/healthz")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API/api/transactions")" = 401
          n=$(curl -s -D- -o /dev/null "$API/api/transactions" -H "Origin: $ORIGIN" \
              | grep -ci 'access-control-allow-origin: https')
          test "$n" = 1  # exactly one ACAO header (browsers reject duplicates)
